name: Compile latest modded-weapons-fix commit

on:
  push:
    branches:
      - modded-weapons-fix
    paths:
      - .github/workflows/compile-modded-weapons-fix.yml

permissions:
  contents: read

concurrency:
  group: mccvr-modded-weapons-fix-only
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out the source commit from modded-weapons-fix
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the branch and exact source commit
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.before }}
        run: |
          if ($env:GITHUB_REF_NAME -ne 'modded-weapons-fix') {
            throw "Refusing to build unexpected branch: $env:GITHUB_REF_NAME"
          }
          $expectedSourceSha = 'b680ad794a1b1d1a6db7998d106b94437213d995'
          if ($env:EXPECTED_SOURCE_SHA -ne $expectedSourceSha) {
            throw "Source revision differs from the reviewed modded-weapons-fix commit. Expected $expectedSourceSha, got $env:EXPECTED_SOURCE_SHA. Refusing to build a different revision."
          }
          $actual = (& git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SOURCE_SHA) {
            throw "Checkout SHA mismatch. Expected $env:EXPECTED_SOURCE_SHA, got $actual"
          }
          $baselineSha = '271f6dffb8cf2e13dc4feafd85b9b4c61440ff25'
          git merge-base --is-ancestor $baselineSha $actual
          if ($LASTEXITCODE -ne 0) {
            throw "Refusing to build a source commit that does not descend from the accepted baseline $baselineSha."
          }
          Write-Host "Requested branch: modded-weapons-fix"
          Write-Host "Exact source commit being built: $actual"
          Write-Host "The main and compilation-test branches are not used as source."

      - name: Verify dual shake menu and ODST diagnostic source
        shell: pwsh
        run: |
          $menu = Get-Content 'src/dll/menu.cpp' -Raw
          if (-not $menu.Contains('ImGui::Checkbox("dual wield shake reload", &g_config.dual_wield_shake_reload)') -or
              -not $menu.Contains('shake to reload a weapon when dual wielding')) {
            throw "This source is missing the requested dual wield shake reload menu option."
          }
          $game = Get-Content 'src/dll/game.cpp' -Raw
          if (-not $game.Contains('static constexpr bool kOdstMappedFpEnabled = false;') -or
              -not $game.Contains('#include "odst_fp_map_probe.inl"') -or
              -not $game.Contains('#include "odst_mythic_layout.inl"')) {
            throw "This source is not the restored ODST diagnostic baseline."
          }

      - name: Set up Python for test generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Populate the exact dependency commits pinned by this source
        shell: pwsh
        run: |
          $dependencies = @(
            @{ Name = 'openxr'; Url = 'https://github.com/KhronosGroup/OpenXR-SDK.git'; Sha = '5267613edf3d937e3d77556a106a65c2f82b25c6' },
            @{ Name = 'minhook'; Url = 'https://github.com/TsudaKageyu/minhook.git'; Sha = 'c3fcafdc10146beb5919319d0683e44e3c30d537' },
            @{ Name = 'imgui'; Url = 'https://github.com/ocornut/imgui.git'; Sha = '8936b58fe26e8c3da834b8f60b06511d537b4c63' }
          )
          New-Item -ItemType Directory -Force 'out/deps' | Out-Null
          foreach ($dependency in $dependencies) {
            $path = "out/deps/$($dependency.Name)-src"
            git clone --quiet --filter=blob:none --depth 1 --no-checkout $dependency.Url $path
            if ($LASTEXITCODE -ne 0) { throw "Could not clone $($dependency.Name)." }
            git -C $path fetch --quiet --depth 1 origin $dependency.Sha
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch pinned $($dependency.Name) commit." }
            git -C $path checkout --quiet --detach $dependency.Sha
            if ($LASTEXITCODE -ne 0) { throw "Could not check out pinned $($dependency.Name) commit." }
          }

      - name: Show Windows build toolchain
        shell: pwsh
        run: |
          cmake --version
          python --version
          git --version

      - name: Clean build, run tests, and package the exact modded-weapons-fix source
        shell: pwsh
        run: .\\tools\\package-candidate.ps1 -Clean

      - name: Verify package files and record source identity
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.before }}
        run: |
          $builds = @(Get-ChildItem 'out/candidates' -Filter '*-Build.zip' -File)
          $sources = @(Get-ChildItem 'out/candidates' -Filter '*-Source.zip' -File)
          $checksums = @(Get-ChildItem 'out/candidates' -Filter '*-SHA256.txt' -File)
          if ($builds.Count -ne 1 -or $sources.Count -ne 1 -or $checksums.Count -ne 1) {
            throw "Expected one build ZIP, one source ZIP, and one checksum file. Found builds=$($builds.Count), sources=$($sources.Count), checksums=$($checksums.Count)."
          }
          $checksumText = Get-Content $checksums[0].FullName -Raw
          if ($checksumText -notmatch [regex]::Escape($env:EXPECTED_SOURCE_SHA)) {
            throw "The package checksum receipt does not identify expected modded-weapons-fix commit $env:EXPECTED_SOURCE_SHA."
          }
          @"
          Source branch: modded-weapons-fix
          Expected source in the first line of HaloMCCVR.log: $env:EXPECTED_SOURCE_SHA
          Includes: previous ODST and dual reload fixes, CE XAM imported-gun muzzle alignment and launcher refusal diagnostics.
          Test MP5 and MP7 muzzle alignment. Both launcher fallbacks remain under investigation.
          If the log reports source 5fdf982e, MCC loaded an older DLL.
          Use the Build ZIP from this artifact, not a previous workflow run.
          "@ | Set-Content 'out/candidates/BUILD-IDENTITY.txt'
          Write-Host "Source branch: modded-weapons-fix"
          Write-Host "Source commit: $env:EXPECTED_SOURCE_SHA"
          Get-FileHash $builds[0].FullName -Algorithm SHA256
          Get-FileHash $sources[0].FullName -Algorithm SHA256
          Get-Content $checksums[0].FullName

      - name: Upload modded-weapons-fix build and matching source
        uses: actions/upload-artifact@v4
        with:
          name: MCCVR-modded-weapons-fix-${{ github.event.before }}
          path: |
            out/candidates/*-Build.zip
            out/candidates/*-Source.zip
            out/candidates/*-SHA256.txt
            out/candidates/BUILD-IDENTITY.txt
          if-no-files-found: error
          retention-days: 14
